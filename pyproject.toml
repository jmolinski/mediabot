[project]
name = "mediabot"
version = "0.1.1"
description = "Telegram bot for fetching yt audio and editing telegram audio files"
requires-python = ">=3.13,<3.14"
dependencies = [
    "eyed3==0.9.7",
    "Pillow",
    "python-telegram-bot",
    "yt-dlp[default]>=2026.7.4",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = [
    "handlers",
    "image_utils",
    "main",
    "media_fetcher",
    "message",
    "mp3_utils",
    "settings",
    "telegram_helpers",
    "utils",
    "youtube_utils",
]
