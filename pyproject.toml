[project]
name = "mediabot"
version = "0.1.1"
description = "Telegram bot for fetching yt audio and editing telegram audio files"
requires-python = ">=3.13,<3.14"
dependencies = [
    "eyed3==0.9.7",
    "Pillow",
    "python-telegram-bot",
    "yt-dlp[default]>=2026.7.4",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "mypy",
    "ruff",
]
