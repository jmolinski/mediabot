[project]
name = "mediabot"
version = "0.1.0"
description = "Telegram bot for fetching yt audio and editing telegram audio files"
requires-python = ">=3.11,<3.12"
dependencies = [
    "eyed3==0.9.7",
    "Pillow==10.3.0",
    "python-telegram-bot==20.5",
    "yt-dlp==2024.10.22",
]

[dependency-groups]
dev = [
    "black==24.3.0",
    "isort==5.12.0",
    "mypy==1.5.1",
    "ruff==0.0.291",
]
