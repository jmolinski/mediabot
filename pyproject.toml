[project]
name = "mediabot"
version = "0.1.1"
description = "Telegram bot for fetching yt audio and editing telegram audio files"
requires-python = ">=3.13,<3.14"
dependencies = [
    "eyed3>=0.9.9",
    "Pillow",
    "python-telegram-bot",
    "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "mypy",
    "ruff",
]

[tool.ruff.lint]
# Keep the original lint rules; isort handles import formatting separately.
select = ["E4", "E7", "E9", "F"]
